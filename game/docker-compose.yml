services:
  game:
    build: .
    ports:
      - "8081:80"
    restart: unless-stopped

  # Postgres do mundo versionado (draft/publicado) — porta 5433 no host
  # para não brigar com um Postgres local na 5432
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: worlds
      POSTGRES_PASSWORD: worlds
      POSTGRES_DB: worlds
    volumes:
      - worlds-pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U worlds -d worlds"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # API do editor (Fase 3) — env vem de ../api/.env; DATABASE_URL é
  # sobrescrita para o host interno do compose
  api:
    build: ../api
    env_file:
      - ../api/.env
    environment:
      DATABASE_URL: postgres://worlds:worlds@postgres:5432/worlds
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  worlds-pgdata:
